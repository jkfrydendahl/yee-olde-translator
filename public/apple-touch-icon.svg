<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D7A52"/>
      <stop offset="100%" style="stop-color:#2D5A3D"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>
  <rect x="6" y="6" width="168" height="168" rx="30" fill="none" stroke="#D4A84B" stroke-width="3"/>
  
  <!-- Scroll shape -->
  <g transform="translate(90, 90)">
    <!-- Main scroll body -->
    <rect x="-35" y="-45" width="70" height="90" rx="4" fill="#F5E6C8" stroke="#D4A84B" stroke-width="2"/>
    
    <!-- Top curl -->
    <ellipse cx="-35" cy="-38" rx="10" ry="12" fill="#F5E6C8" stroke="#D4A84B" stroke-width="2"/>
    <ellipse cx="-35" cy="-38" rx="5" ry="7" fill="#D4A84B"/>
    
    <!-- Bottom curl -->
    <ellipse cx="35" cy="38" rx="10" ry="12" fill="#F5E6C8" stroke="#D4A84B" stroke-width="2"/>
    <ellipse cx="35" cy="38" rx="5" ry="7" fill="#D4A84B"/>
    
    <!-- Text lines on scroll -->
    <line x1="-22" y1="-25" x2="22" y2="-25" stroke="#2D5A3D" stroke-width="3" stroke-linecap="round"/>
    <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#2D5A3D" stroke-width="3" stroke-linecap="round"/>
    <line x1="-22" y1="5" x2="22" y2="5" stroke="#2D5A3D" stroke-width="3" stroke-linecap="round"/>
    <line x1="-22" y1="20" x2="10" y2="20" stroke="#2D5A3D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
