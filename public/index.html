<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ye Olde Translator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text x='50%' y='60%' font-size='30' text-anchor='middle' dominant-baseline='middle'>📜</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Ye Olde Translator</h1>
    <p class="subtitle">Transform thy modern speech into dramatic medieval prose!</p>
    <a href="history.html" class="history-link">📚 View Translation History</a>

    <div class="input-group">
      <label for="inputText">Thy Modern Words:</label>
      <textarea 
        id="inputText" 
        placeholder="Enter thy modern text here, good traveler..."
        maxlength="5000"
      ></textarea>
      <div class="char-count"><span id="charCount">0</span> / 5000</div>
    </div>

    <div class="input-group">
      <label for="styleSelect">Translation Style:</label>
      <select id="styleSelect">
        <option value="medieval">🏰 Medieval - Thees and thous</option>
        <option value="shakespearean">🎭 Shakespearean - Flowery and dramatic</option>
        <option value="chaucerian">📜 Chaucerian - Middle English spellings</option>
        <option value="royal">👑 Royal Decree - Pompous proclamations</option>
        <option value="bardic">🎵 Bardic - Storyteller's voice</option>
      </select>
    </div>

    <div class="input-group">
      <label for="languageSelect">Output Language:</label>
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="da">Danish</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="it">Italian</option>
        <option value="nl">Dutch</option>
        <option value="pt">Portuguese</option>
        <option value="sv">Swedish</option>
        <option value="no">Norwegian</option>
        <option value="pl">Polish</option>
        <option value="ja">Japanese</option>
      </select>
    </div>

    <button class="btn" id="translateBtn">
      ⚔️ Translate, Forsooth!
    </button>

    <div class="output-container" id="outputContainer">
      <div class="output-header">
        <span class="output-label">Thy Translation:</span>
        <button class="copy-btn" id="copyBtn">📋 Copy</button>
      </div>
      <div class="output" id="output"></div>
    </div>
  </div>

  <footer>
    Wrought with theatrical flair by <a href="https://github.com/jkfrydendahl" target="_blank">jkfrydendahl</a>
  </footer>

  <script src="js/history.js"></script>
  <script>
    const API_URL = 'https://yee-olde-translator.vercel.app/api/translate';
    
    const inputText = document.getElementById('inputText');
    const charCount = document.getElementById('charCount');
    const styleSelect = document.getElementById('styleSelect');
    const languageSelect = document.getElementById('languageSelect');
    const translateBtn = document.getElementById('translateBtn');
    const outputContainer = document.getElementById('outputContainer');
    const output = document.getElementById('output');

    let lastTranslation = '';

    // Character counter
    inputText.addEventListener('input', () => {
      const count = inputText.value.length;
      charCount.textContent = count;
      charCount.parentElement.className = 'char-count' + 
        (count > 4500 ? ' error' : count > 4000 ? ' warning' : '');
    });

    // Enter key to submit (Ctrl+Enter or Cmd+Enter)
    inputText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        translateText();
      }
    });

    // Button click handlers
    translateBtn.addEventListener('click', translateText);
    document.getElementById('copyBtn').addEventListener('click', copyToClipboard);

    async function translateText() {
      const text = inputText.value.trim();
      
      if (!text) {
        showError('Prithee, enter some text to translate!');
        return;
      }

      const style = styleSelect.value;
      const language = languageSelect.value;

      // Show loading state
      translateBtn.disabled = true;
      translateBtn.innerHTML = '<span class="spinner"></span> Translating...';
      outputContainer.classList.add('visible');
      output.className = 'output loading';
      output.innerHTML = '<span class="spinner"></span> The scribes art working...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ text, style, language }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Translation failed');
        }

        lastTranslation = data.translation;
        output.className = 'output';
        const langTag = language !== 'en' ? ` · ${data.language.emoji} ${data.language.name}` : '';
        output.innerHTML = `<span class="style-tag">${data.style.emoji} ${data.style.name}${langTag}</span>\n\n${data.translation}`;

        // Save to history
        HistoryManager.save(style, { style: style, language: language, original: text }, data.translation);

      } catch (error) {
        showError(error.message || 'Zounds! Something went wrong.');
      } finally {
        translateBtn.disabled = false;
        translateBtn.innerHTML = '⚔️ Translate, Forsooth!';
      }
    }

    function showError(message) {
      outputContainer.classList.add('visible');
      output.className = 'output error';
      output.textContent = '⚠️ ' + message;
    }

    async function copyToClipboard() {
      if (!lastTranslation) return;
      
      try {
        await navigator.clipboard.writeText(lastTranslation);
        const copyBtn = document.querySelector('.copy-btn');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✓ Copied!';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      } catch (err) {
        console.error('Failed to copy:', err);
      }
    }
  </script>
</body>
</html>
